<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ns-admin" content="__ADMIN_TOKEN__">
<title>NovelSims 后端</title>
<style>

:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#e4e9ef;
  --accent:#1f6f8b; --accent-2:#e7f4f7; --soft:#f7f8fa; --shadow:0 12px 32px rgba(27,36,48,.08);
  --radius:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#ns-particles{display:none}
.sheet{height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.nav{display:flex;align-items:center;gap:18px;padding:14px 22px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:720;letter-spacing:-.03em;font-size:18px;min-width:max-content}
.brand .word{font-weight:680}
.ver{font-style:normal;font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-2);border-radius:999px;padding:2px 8px}
.links{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.links button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font-weight:600}
.links button.on{background:var(--ink);color:#fff}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 12px;height:38px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;width:180px}
.ib{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;position:relative;display:grid;place-items:center}
.ib em{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:99px;background:#d4534a;color:#fff;font-style:normal;font-size:10px;display:grid;place-items:center;padding:0 4px}
.win-controls{display:flex;gap:6px}
.win-controls button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff}
.main{flex:1;overflow:auto;overflow-x:hidden;padding:8px 8px 28px}
.ph{display:flex;align-items:baseline;gap:12px;padding:18px 22px 0}
.ph h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:680}
.sub{color:var(--muted);font-size:13px}
.chip{font-size:12px;color:var(--accent);background:var(--accent-2);border-radius:999px;padding:3px 8px}
.wrap,.wrapx{padding:8px 22px 24px;max-width:1180px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.note{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:620}
.btn.p,.cta,.bigbtn{background:var(--ink);color:#fff;border-color:transparent}
.bigbtn,.cta{border:0;border-radius:999px;padding:12px 18px;font-weight:680}
.btn:hover,.bigbtn:hover,.cta:hover{transform:translateY(-1px)}
.empty{color:var(--muted);padding:28px;text-align:center}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input:not([type]),textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
textarea{min-height:90px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(20,28,38,.38);display:grid;place-items:center;z-index:30;padding:24px}
.modal>div{background:#fff;border-radius:22px;padding:22px;width:min(560px,94vw);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;z-index:40;font-size:13px}
.tg{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--soft);color:var(--muted)}
.tg.ok{background:#e5f6ee;color:#1d7a45}.tg.bad{background:#fdeceb;color:#b42318}.tg.w{background:#fff6e5;color:#9a6700}.tg.in{background:var(--accent-2);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;color:#fff;font-style:normal;font-weight:700}
.hero2{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px;padding:28px;border-radius:28px;
  background:linear-gradient(145deg,#f7fbff 0%,#eef6f4 48%,#f4f1ea 100%);border:1px solid var(--line);overflow:hidden;min-height:280px}
.hero2 .art{display:none}
.ht h1{margin:0 0 8px;font-size:40px;line-height:1.15;letter-spacing:-.04em;font-weight:680}
.hs{color:var(--muted);max-width:36em}
.finder{background:#fff;border-radius:22px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.fh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fh h2,.finder h2{margin:0}
.fs{color:var(--muted);font-size:13px}
.seg2{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:6px 10px;color:var(--muted)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.fields .v{font-weight:650}
.statement{margin:22px 0 8px}
.statement h2{margin:0 0 6px;font-size:32px;letter-spacing:-.03em;font-weight:650}
.statement p{color:var(--muted);margin:0}
.statband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.sb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.sb b{display:block;font-size:28px;letter-spacing:-.03em}
.sb span{color:var(--muted);font-size:13px}
.testi{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,.6fr);gap:12px}
.tcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.port{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.quote{margin:0 0 6px}
.who{color:var(--muted);font-size:12px}
.tside{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.row2{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dark2{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.dark2 h2{margin:0 0 6px}
.ds{color:var(--muted);margin-bottom:12px}
.plan{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px}
.pic{border-radius:18px;background:linear-gradient(160deg,#d7ebe8,#f6f1e6);min-height:180px}
.library-shell{padding:6px 18px 28px;overflow-x:hidden}
.library-hero{border-radius:24px;padding:26px 28px;background:linear-gradient(160deg,#ffffff,#f3f7f8);border:1px solid var(--line);margin-bottom:14px}
.library-hero h2{margin:6px 0;font-size:32px;letter-spacing:-.03em;font-weight:680}
.library-hero p{color:var(--muted);max-width:46em}
.library-meta{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.library-tabs,.rank-tabs{display:flex;flex-wrap:wrap;gap:8px}
.library-tabs button,.rank-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:var(--muted)}
.library-tabs button.on,.rank-tabs button.on{background:var(--ink);color:#fff;border-color:transparent}
.library-section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 4px 8px}
.library-section-title h3{margin:0}
.library-section-title span{color:var(--muted);font-size:13px}
.bookshelf{display:flex;flex-direction:column;gap:22px;overflow-x:hidden;overflow-y:visible;padding:6px 2px 10px;perspective:1100px}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 7px;padding:16px 14px 14px;border-radius:8px 8px 12px 12px;
  background:linear-gradient(#fbfaf7,#f7f4ee) padding-box;
  box-shadow:inset 0 -12px 0 #e4ddd2, 0 14px 18px rgba(60,48,32,.06);
  overflow:hidden;max-width:100%}
.book-spine{position:relative;width:48px;height:176px;flex:0 0 48px;border:0;border-radius:4px 7px 6px 4px;padding:12px 6px 10px;
  color:#fff;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 18%,transparent 78%,rgba(255,255,255,.18)), var(--spine,#1f6f8b);
  box-shadow:2px 6px 10px rgba(20,24,32,.12);transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.book-spine:hover,.book-spine:focus-visible{transform:translateY(-16px) rotateY(-16deg) rotateX(4deg);box-shadow:16px 22px 28px rgba(20,24,32,.2);z-index:2;outline:none}
.spine-title{writing-mode:vertical-rl;text-orientation:mixed;font-weight:700;letter-spacing:.12em;font-size:13px;line-height:1.25;max-height:128px;overflow:hidden}
.spine-author{writing-mode:vertical-rl;font-size:10px;opacity:.8;letter-spacing:.08em;max-height:36px;overflow:hidden}
.book-open{animation:bookOpen .55s cubic-bezier(.2,.8,.2,1);transform-origin:left center}
@keyframes bookOpen{from{opacity:.35;transform:perspective(1200px) rotateY(-68deg) scaleX(.72)}to{opacity:1;transform:none}}
.book-detail{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.book-cover{height:280px;border-radius:8px 16px 16px 8px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;
  background:linear-gradient(165deg,#244e63,#1f6f8b 55%,#d7efe6);position:relative;overflow:hidden}
.book-cover .book-glyph{font-size:42px;font-weight:720;letter-spacing:-.04em}
.cover-title{font-weight:700;font-size:18px}
.book-cover img{width:100%;height:100%;object-fit:cover}
.character-pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.character-pills span,.character-pills button{background:var(--soft);border-radius:999px;padding:6px 10px;border:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.idc{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:#fff;border-radius:20px;overflow:hidden;padding:0;box-shadow:var(--shadow)}
.idc .band{height:84px;display:flex;align-items:flex-end;padding:12px;background:linear-gradient(120deg,#e7f4f7,#f6f1e8)}
.idc .bd{padding:12px 14px}
.idc .nm{font-weight:720;font-size:18px}
.idc .id2{color:var(--muted);font-size:13px;min-height:2.4em}
.idc .ft{display:flex;justify-content:space-between;gap:8px;padding:0 14px 12px;color:var(--muted);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trait{background:var(--accent-2);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:12px}
.idd{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:16px;align-items:start}
.idl .band{height:120px;border-radius:18px;background:linear-gradient(140deg,#17324a,#1f6f8b);color:#fff;display:flex;align-items:flex-end;padding:14px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.rel-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px}
.rel-stage{background:
  radial-gradient(circle at 20% 20%,rgba(31,111,139,.06),transparent 28%),
  linear-gradient(#fbfcfd,#f4f7f8);
  border:1px solid var(--line);border-radius:22px;min-height:520px;position:relative;overflow:hidden}
.rel-stage svg{width:100%;height:540px;display:block}
.rel-node{cursor:pointer}
.rel-node text{font-size:13px;fill:var(--ink);font-weight:650}
.rel-edge{fill:none;stroke:#9aa8b6;stroke-width:1.4}
.rel-edge.家人{stroke:#1f6f8b}.rel-edge.恋人{stroke:#c45c74}.rel-edge.对手{stroke:#b45309}.rel-edge.师徒{stroke:#3d6b4f}.rel-edge.朋友{stroke:#3f4c7a}
.rel-side{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend i{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:4px}
@media(max-width:980px){
  .hero2,.testi,.plan,.book-detail,.idd,.cols,.rel-layout,.fields,.statband{grid-template-columns:1fr}
  .nav{flex-wrap:wrap}
  .topr{width:100%}
  .ht h1{font-size:32px}
}
@media(prefers-reduced-motion:reduce){
  .book-spine,.book-open,.btn{transition:none;animation:none}
}


/* 0.4.0 Aurelis: warm paper, burgundy, serif numbers */
:root{--bg:#ECEBE1;--paper:#E6E2D6;--ink:#2C211C;--muted:#7A6E66;--line:#D4CFC2;--accent:#5A1A1A;--accent-2:#F4E7E4;--wine:#5A1A1A;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Playfair Display","Times New Roman",serif}
html,body,.sheet{background:#ECEBE1!important;color:#2C211C!important}
h1,h2,h3,.ph h1,.sb b,.ht h1,.library-hero h2,.library-section-title h3,.nm,.stat b,.feat h2,.book-detail h2{font-family:var(--serif)!important;font-weight:560;letter-spacing:-.02em;color:#2C211C}
.nav{display:grid!important;grid-template-columns:minmax(140px,auto) 1fr auto;align-items:center;background:transparent!important;border:0!important;padding:14px 18px 6px}
.brand{font-family:var(--serif);color:#5A1A1A}
.ver{background:#F4E7E4;color:#5A1A1A}
.links{justify-self:center;display:flex;background:#E0DCD0;border-radius:999px;padding:4px;gap:2px}
.links button{color:#6d625a;padding:8px 14px;font-size:13px;font-weight:600}
.links button.on{background:#5A1A1A!important;color:#F7F3EA!important}
.card,.sb,.finder,.tcard,.tside,.dark2,.library-hero,.idc,.rel-stage,.rel-side,.book-detail,.modal>div,.tile{background:#E6E2D6!important;border-color:#D4CFC2!important;color:#2C211C;box-shadow:0 10px 24px rgba(70,50,30,.05)!important}
.btn{background:#EFEBE3;border-color:#D4CFC2;border-radius:999px}
.btn.p,.cta,.bigbtn{background:#5A1A1A!important;color:#F7F3EA!important;border-color:transparent!important;border-radius:999px}
.note,.sub,.fs,.who,.hs,.ds{color:#7A6E66}
.shelf{background:#EFEBE1!important;box-shadow:inset 0 -12px 0 #D2C8B6, 0 12px 18px rgba(70,48,28,.06)!important}
.book-spine{color:#3A2A24}
.book-cover{background:linear-gradient(165deg,#3A1212,#5A1A1A 58%,#C4B49A)!important}
.idc .band,.idl .band{background:linear-gradient(120deg,#E7E0D2,#D9CBBA)!important}
.trait,.chip,.tg.in,.pill{background:#F4E7E4;color:#5A1A1A}
.search,.seg2,.ib,.win-controls button{background:#EFEBE3;border-color:#D4CFC2}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 14px}
.dash-head h1{margin:0;font-size:40px}
.dash-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{position:relative;background:#E6E2D6;border:1px solid #D4CFC2;border-radius:22px;padding:16px 16px 14px;min-height:148px}
.stat b{font-size:44px;line-height:1;display:block;margin:8px 0 4px}
.delta{font-size:12px;color:#5A1A1A}
.more{position:absolute;top:10px;right:12px;border:0;background:transparent;color:#8A7E74;letter-spacing:.2em;font-size:16px}
.dots{display:grid;grid-template-columns:repeat(10,7px);gap:4px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:99px;background:#D4CFC2;display:block}
.dots i.on{background:#5A1A1A}
.feat{position:relative;min-height:280px}
.feat-body{display:flex;gap:14px;align-items:center;margin:12px 0}
.portrait{width:96px;height:112px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#8d5a4a,#3a1212 70%);color:#F7F3EA;display:grid;place-items:center;font-family:var(--serif);font-size:40px;flex:none}
.kicker{font-size:11px;letter-spacing:.16em;color:#7A6E66}
.span2{grid-column:1 / -1;display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:12px}
.act{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid #D4CFC2;font-size:13px}
.act em{font-style:normal;color:#5A1A1A;font-size:12px}
.conn{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #D4CFC2;font-size:13px}
.conn i{width:8px;height:8px;border-radius:99px;background:#5A1A1A;display:inline-block;margin-right:6px}
.gauge-wrap{display:flex;align-items:flex-end;gap:8px}
.library-hero{background:linear-gradient(160deg,#EFEBE1,#E4D9CC)!important}
@media(max-width:980px){.dash-grid,.span2,.stats{grid-template-columns:1fr}.span2{grid-column:auto}}

/* 0.4.0 frameless window, carved frame, portraits, timeline */
html,body{background:transparent!important}
.sheet{background:#ECEBE1!important;border-radius:22px;overflow:hidden;height:100vh;box-shadow:0 0 0 1px rgba(90,26,26,.45), inset 0 0 0 7px rgba(90,26,26,.06), inset 0 0 0 8px rgba(247,243,234,.35)}
.sheet::before{content:"";pointer-events:none;position:absolute;inset:11px;border-radius:14px;z-index:6;
  background:
    radial-gradient(circle at 0 0, transparent 14px, rgba(90,26,26,.45) 15px, rgba(90,26,26,.45) 16px, transparent 17px),
    radial-gradient(circle at 100% 0, transparent 14px, rgba(90,26,26,.45) 15px, rgba(90,26,26,.45) 16px, transparent 17px),
    radial-gradient(circle at 0 100%, transparent 14px, rgba(90,26,26,.45) 15px, rgba(90,26,26,.45) 16px, transparent 17px),
    radial-gradient(circle at 100% 100%, transparent 14px, rgba(90,26,26,.45) 15px, rgba(90,26,26,.45) 16px, transparent 17px);
  border:1px solid rgba(90,26,26,.28)}
.nav,.main,.ph{position:relative;z-index:7}
.pywebview-drag-region{ -webkit-app-region:drag }
.win-controls,.win-controls button,.links button,.topr button,.topr input,.search{ -webkit-app-region:no-drag }
.library-hero,.dash-head{position:relative}
.library-hero::after,.dash-head::after{content:"";position:absolute;right:8px;top:-6px;width:120px;height:90px;opacity:.22;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 90'><path d='M70 82c8-22 8-40 0-58 10 6 22 8 32 4-8 16-8 34 0 52-12-2-24 0-32 2z' fill='none' stroke='%235A1A1A' stroke-width='1.4'/><path d='M60 20c6 10 8 24 6 40' fill='none' stroke='%235A1A1A' stroke-width='1.2'/><circle cx='78' cy='22' r='8' fill='none' stroke='%235A1A1A'/><path d='M70 18c2-6 10-8 14-4' fill='none' stroke='%235A1A1A'/></svg>") center/contain no-repeat}
.dossier .card h3{font-size:22px;margin:0 0 8px}
.dossier .prose{font-size:16px;line-height:1.75;color:#2C211C}
.portrait-lg{width:168px;height:210px;border-radius:18px;background:linear-gradient(180deg,#E7D9C8,#D7C4AE);display:grid;place-items:center;margin-bottom:12px;border:1px solid rgba(90,26,26,.2)}
.portrait-lg svg{width:140px;height:180px}
.life{margin:0 0 12px;padding:8px 4px 4px 8px}
.life ol{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid rgba(90,26,26,.35)}
.life li{position:relative;padding:0 0 14px 16px}

.life b{display:block;font-family:var(--serif);color:#5A1A1A}

<script>
(function(){
const TOKEN=document.querySelector('meta[name=ns-admin]').content;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=n=>String(n||'').replace(/【[^】]*】/g,'').replace(/\s+([，。！？、：；,.!?])/g,'$1').replace(/\s+/g,' ').trim();
const COL=['#d9772f','#b5483a','#8a5a3c','#b8892f','#6f7a52','#3f6a78','#7a4e6e','#5a4636'];
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return COL[h%COL.length]};
const av=(n,x)=>`<i class="av" style="background:${hue(n)}${x?`;width:${x}px;height:${x}px`:''}">${esc(nm(n).charAt(0)||'?')}</i>`;
const api=(p,o={})=>fetch('/api/v1/admin/'+p,{method:o.method||'GET',headers:{'X-NovelSims-Admin':TOKEN,'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined}).then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok){const e=new Error(j.message||j.code||r.status);e.code=j.code;throw e}return j}));
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)};
const modal=(title,html,wide)=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div ${wide?'style="width:min(900px,96vw)"':''}><b style="font-size:15px">${esc(title)}</b>${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);m.close=()=>m.remove();return m};
const ERR={consent_required:'还没有勾选“我已知晓并同意发送”并保存。',no_key:'还没有填写 API Key。',not_configured:'请先填写模型名。',llm_auth:'密钥无效或没有权限（401/403）。',llm_billing:'余额不足或未开通服务（402）。',llm_not_found:'地址或模型名不对（404）。',llm_rate_limited:'请求太频繁或额度用尽（429）。',llm_timeout:'连接超时。',llm_unavailable:'连不上服务，请检查网络和地址。',llm_bad_request:'服务拒绝了请求参数（400）。',llm_bad_response:'服务返回了无法识别的内容。',llm_truncated:'模型输出被截断或把额度花在“思考”上，请换成非推理模型（如 glm-4.5-air）。',extraction_failed:'模型没有给出可用的人物结果。'};
const ST={draft:['草稿·待校对','w'],low_data:['资料不足','bad'],confirmed:['已确认','ok'],fixture:['测试角色','in'],user_defined:['自设角色','in']};
const stag=s=>{const x=ST[s]||[s||'—',''];return `<span class="tg ${x[1]}">${x[0]}</span>`};
const PLUMB=(w)=>`<svg viewBox="0 0 40 64" width="${w||24}" aria-hidden="true"><path d="M20 0L38 22L20 64L2 22Z" fill="#43c551"/><path d="M20 0L38 22L20 26Z" fill="#8ae68f"/><path d="M20 0L2 22L20 26Z" fill="#62d66c"/><path d="M2 22L20 26L20 64Z" fill="#2fa83d"/></svg>`;
const PAGES={overview:['概览','',''],library:['小说库','竖向书架 · 点一本书打开','书架'],novels:['检索任务','全网检索后生成身份卡','创作'],cards:['角色身份卡','校对、编辑、确认后绑定到游戏小人','创作'],relations:['关系网','人物之间的连线','创作'],model:['模型','选择大模型与联网检索来源','设置'],link:['连接','游戏与后端的连接方式','设置'],logs:['日志','最近的对话请求','']};
let V={p:'library',nid:null,cid:null,edit:false,tab:'cards',sel:null,q:'',ft:'all',libCategory:'全部',libRank:'全部',libQ:'',libSource:'global',jjPeriod:'month',jjChannel:'全部',relNovel:''},OV=null,timer=null,S=null;
const ago=s=>s==null?'还没有':s<60?Math.round(s)+' 秒前':s<3600?Math.round(s/60)+' 分钟前':Math.round(s/3600)+' 小时前';
const dom=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const match=(...f)=>!V.q||f.join(' ').toLowerCase().includes(V.q.toLowerCase());
function chrome(){$('#plb').innerHTML='<svg viewBox="0 0 24 24" width="18" aria-hidden="true"><path d="M5 4h6a4 4 0 0 1 4 4v12H9a4 4 0 0 0-4 4V4z" fill="#5A1A1A"/><path d="M19 4h-6v16h6a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" fill="#8C4A3A"/></svg>';
 $('#nav').innerHTML=Object.keys(PAGES).map(k=>`<button data-p="${k}" class="${k===V.p?'on':''}">${PAGES[k][0]}</button>`).join('');
 $$('#nav button').forEach(b=>b.onclick=()=>{V.cid=null;V.edit=false;go(b.dataset.p)});
 const ov=V.p==='overview';$('#ph').style.display=ov?'none':'flex';$('#ttl').textContent=PAGES[V.p][0];$('#sub').textContent=PAGES[V.p][1];$('#chip').textContent=PAGES[V.p][2];$('#chip').style.display=PAGES[V.p][2]?'':'none';
 if(OV){const p=OV.provider;$('#status').innerHTML=`<span class="pill">${av(p.name)}<span>${esc(p.name)}${p.model?' · '+esc(p.model):''}</span></span>`;const n=$('#belln');n.style.display=OV.errors?'grid':'none';n.textContent=OV.errors}}
function go(p){V.p=p;try{if(history&&history.replaceState&&location.origin!=='null'){history.replaceState(null,'','#'+p)}}catch(e){/* ignore history restrictions in sandboxed/preview contexts */}clearInterval(timer);timer=null;load()}


function showBookDetailPage(b){
  const cover = bookCover(b);
  $('#page').innerHTML=`<div class="wrap book-open">
    <button class="btn" id="book-back" style="margin-bottom:16px">← 返回书架</button>
    <div class="book-detail">
      ${cover}
      <div>
        <div class="library-meta">${esc(b.region||'')} · ${esc(b.era||'')} · ${esc(b.genre||'')}</div>
        <h2>${esc(b.title)}</h2>
        <div class="note">${esc(b.author||'')}　·　${esc(b.rank||'')}</div>
        <p>${esc(b.description||'暂无简介')}</p>
        <div class="tags">${[b.genre,b.region,b.era].filter(Boolean).map(t=>`<span class="trait">${esc(t)}</span>`).join('')}</div>
        <b>相关人物</b>
        <div class="character-pills">${(b.characters||[]).map(n=>`<span>${esc(n)}</span>`).join('')||'<span>暂无</span>'}</div>
        <div class="note">生成身份卡会先做完整的公开网页检索（外貌、性格、经历、关系、原话）。资料不够时不会保存一张空卡。</div>
        <div class="bar" style="margin-top:20px">
          <button class="btn p" id="book-start">为这本书检索并生成身份卡</button>
          <button class="btn" id="book-rel">看这批人物的关系网</button>
        </div>
      </div>
    </div>
  </div>`;
  $('#book-back').onclick=()=>pLibrary();
  const startBtn = $('#book-start');
  if(startBtn) startBtn.onclick = () => {
    api('novels',{method:'POST',body:{title:b.title,author:b.author||'',version:'原著',characters:(b.characters||[]).join('\n'),mode:'web'}}).then(n=>api('novels/start',{method:'POST',body:{novel_id:n.novel_id}})).then(()=>{toast('已开始全网检索并生成身份卡');go('novels')}).catch(e=>toast(e.message));
  };
  const relBtn=$('#book-rel');
  if(relBtn) relBtn.onclick=()=>{V.relNovel='';go('relations')};
}


function pRelations(){
  const q=V.relNovel?('?novel_id='+encodeURIComponent(V.relNovel)):'';
  return api('relations'+q).then(data=>{
    const novels=data.novels||[], nodes=data.nodes||[], edges=data.edges||[];
    const opts=['<option value="">全部已有身份卡</option>'].concat(novels.map(n=>`<option value="${esc(n.novel_id)}" ${V.relNovel===n.novel_id?'selected':''}>${esc(n.title)}</option>`)).join('');
    if(!nodes.length){
      $('#page').innerHTML=`<div class="wrap"><div class="card rel-empty"><h2>还没有可以连线的人物</h2><p class="note">关系网从身份卡里的人物关系，以及正文摘录里互相提到的名字整理出来。先检索一本书并生成身份卡，再回到这里。</p><div class="bar"><button class="btn p" id="rel-lib">去书架选一本书</button><button class="btn" id="rel-new">检索一个角色</button></div></div></div>`;
      $('#rel-lib').onclick=()=>go('library');
      $('#rel-new').onclick=()=>{go('cards');newCard()};
      return;
    }
    const W=1000,H=560,cx=500,cy=280,R=Math.min(210, 70+nodes.length*8);
    const pos={};
    nodes.forEach((n,i)=>{
      const a=-Math.PI/2+i*2*Math.PI/nodes.length;
      pos[n.id]={x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R};
    });
    const lines=edges.map(e=>{
      const a=pos[e.source], b=pos[e.target];
      if(!a||!b) return '';
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      return `<path class="rel-edge ${esc(e.relation)}" d="M${a.x} ${a.y} Q ${mx} ${my-18} ${b.x} ${b.y}"></path><text x="${mx}" y="${my-6}" text-anchor="middle" fill="#5d6b7c" font-size="11">${esc(e.relation||'关联')}</text>`;
    }).join('');
    const dots=nodes.map(n=>{
      const p=pos[n.id];
      return `<g class="rel-node" data-id="${esc(n.id)}" data-ghost="${n.ghost?1:0}"><circle cx="${p.x}" cy="${p.y}" r="${n.ghost?16:22}" fill="${n.ghost?'#eef2f5':'#fff'}" stroke="${n.ghost?'#c5d0da':'#1f6f8b'}" stroke-width="2"></circle><text x="${p.x}" y="${p.y+36}" text-anchor="middle">${esc(n.name)}</text></g>`;
    }).join('');
    $('#page').innerHTML=`<div class="wrap"><div class="rel-layout"><div class="rel-stage"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="人物关系网">${lines}${dots}</svg></div>
      <aside class="rel-side"><h3 style="margin:0 0 8px">关系网</h3><label>范围</label><select id="rel-novel">${opts}</select>
      <div class="legend"><span><i style="background:#1f6f8b"></i>家人</span><span><i style="background:#c45c74"></i>恋人</span><span><i style="background:#b45309"></i>对手</span><span><i style="background:#3d6b4f"></i>师徒</span><span><i style="background:#3f4c7a"></i>朋友</span></div>
      <p class="note">点一个实心节点打开身份卡。浅色节点是卡片里提到、但还没有独立身份卡的人。</p>
      <div class="bar"><button class="btn" id="rel-refresh">重新整理</button><button class="btn p" id="rel-search">去检索补全</button></div></aside></div></div>`;
    $('#rel-novel').onchange=e=>{V.relNovel=e.target.value;pRelations()};
    $('#rel-refresh').onclick=()=>pRelations();
    $('#rel-search').onclick=()=>{if(V.relNovel){V.nid=V.relNovel;go('novels')}else go('library')};
    $$('.rel-node').forEach(g=>g.onclick=()=>{
      if(g.dataset.ghost==='1'){toast('这个名字还没有独立身份卡');return}
      V.cid=g.dataset.id;V.edit=false;go('cards');
    });
  }).catch(e=>{$('#page').innerHTML=`<div class="card">关系网暂时无法加载：${esc(e.message)}</div>`});
}


function load(){return api('overview').then(o=>{OV=o;chrome();return({overview:pOverview,library:pLibrary,model:pModel,link:pLink,novels:pNovels,cards:pCards,relations:pRelations,logs:pLogs})[V.p]()}).catch(e=>{$('#page').innerHTML=`<div class="card">无法读取后端数据：${esc(e.message)}</div>`})}
$('#newn').onclick=()=>{go('novels');newNovel()};$('#bell').onclick=()=>go('logs');
$('#win-min').onclick=()=>{if(window.pywebview&&window.pywebview.api)window.pywebview.api.minimize()};
$('#win-close').onclick=()=>{if(window.pywebview&&window.pywebview.api)window.pywebview.api.close()};
$('#q').oninput=e=>{V.q=e.target.value.trim();if(V.p==='library'){V.libQ=V.q;pLibrary()}else if(!['novels','cards'].includes(V.p)){V.cid=null;go('cards')}else load()};

/* ---------- 概览 ---------- */
const OKST=['confirmed','user_defined','fixture'];
function pOverview(){const o=OV;return Promise.all([api('characters'),api('catalog?category='+encodeURIComponent('全部')+'&rank='+encodeURIComponent('全部')+'&q=')]).then(([c,cat])=>{
 const cs=c.characters||[], tot=cs.length, conf=cs.filter(x=>OKST.includes(x.status)).length, low=cs.filter(x=>x.status==='low_data').length, draft=Math.max(0,tot-conf);
 const books=(cat&&(cat.count||(cat.books||[]).length))||0;
 const feat=cs.find(x=>OKST.includes(x.status))||cs[0];
 const rate=tot?Math.round(100*conf/tot):0;
 const arc=Math.round(rate/100*157);
 const mx=p=>'<span class="dots">'+Array.from({length:40},(_,i)=>'<i class="'+(i<Math.round(Math.max(0,Math.min(1,p))*40)?'on':'')+'"></i>').join('')+'</span>';
 const recent=(o.recent||[]).slice(0,5).map(r=>'<div class="act"><b>'+esc(nm(r.actor_name)||'系统')+'</b><span>'+esc(nm(r.text)||r.outcome||'')+'</span><em>'+esc(r.outcome||'')+'</em></div>').join('')||'<div class="note">还没有对话。回到游戏里点一个小人即可。</div>';
 const tr=o.transports||{}, on=k=>tr[k]&&tr[k].on;
 const stat=(k,n,d,p)=>'<article class="stat"><button class="more" tabindex="-1">···</button><div class="kicker">'+k+'</div><b>'+n+'</b><div class="delta">'+d+'</div>'+mx(p)+'</article>';

 $('#page').innerHTML=`<div class="wrap"><div class="cols"><div class="tiles">${tiles}</div><div style="display:flex;flex-direction:column;gap:14px;min-width:0"><div class="card"><h3>${esc(p.name)}</h3><div class="note">${esc(p.note)}</div>
 ${p.id==='mock'?'':`<label>接口地址 Base URL</label><input type="text" id="f-url" value="${esc(p.base_url)}"><label>模型</label><input type="text" id="f-model" list="dl" value="${esc(p.model)}" placeholder="${p.id==='doubao'?'接入点 ID，如 ep-xxxx':'模型名'}"><datalist id="dl">${p.models.map(m=>`<option value="${esc(m)}">`).join('')}</datalist><div class="note" id="rm" style="color:var(--warn)"></div>`}
 ${rem?`<label>API Key${p.key.has_key?`（已保存 ${esc(p.key.hint)}${p.key.source==='env'?'，来自环境变量':''}；留空保持不变）`:''}</label><input type="password" id="f-key" autocomplete="off" placeholder="sk-…">`:''}
 ${p.id==='mock'?'':`<label>随机性 Temperature：<span id="tv">${S.temperature}</span></label><input type="range" id="f-temp" min="0" max="1.5" step="0.1" value="${S.temperature}">`}
 ${rem?`<div class="consent"><b>数据外发确认</b><ul id="disc"></ul><button class="btn s" id="pv">查看将发送的内容</button><label><input type="checkbox" id="f-ok"${p.consent?' checked':''}> 我已知晓并同意向该服务发送以上数据</label></div>`:''}
 <div class="bar" style="margin-top:14px"><button class="btn p" id="sv">保存并设为当前模型</button><button class="btn" id="ts">保存并测试连接</button></div><div id="out"></div></div>
 <div class="card"><h3>联网检索（小说资料来源）</h3><div class="note">小说身份卡流程默认只使用无需 Key 的必应 / DuckDuckGo 公开网页检索，并在本地用规则引擎整理人物；不会调用智谱、Tavily 或其他大模型 API。下方扩展检索源设置暂保留，供后续手动启用扩展工作流。</div>${eng}
 <label>Tavily API Key（可选，最稳定）${S.search.engines.find(e=>e.id==='tavily').has_key?'（已保存；留空保持不变）':''}</label><input type="password" id="f-tav" autocomplete="off" placeholder="tvly-…">
 <label>最多读取网页数：<span id="mpv">${S.search.max_pages}</span></label><input type="range" id="f-mp" min="3" max="30" step="1" value="${S.search.max_pages}">
 <div class="bar" style="margin-top:12px"><button class="btn p" id="ssv">保存检索设置</button></div></div></div></div></div>`;
 $$('.tile').forEach(b=>b.onclick=()=>{V.sel=b.dataset.id;drawModel()});
 const RE=/glm-4\.7|glm-5|reasoner|thinking|deepseek-r1|qwq|(^|[^a-z])o[13]([^a-z]|$)/i,hint=()=>{const m=$('#f-model');if(m&&$('#rm'))$('#rm').textContent=RE.test(m.value)?'⚠ 这是推理类模型：回复很慢（常要十几秒以上），整理人物时容易超时或被截断。游戏对话和整理人物都建议用 glm-4.5-air / deepseek-flash 这类快速模型。':''};if($('#f-model')){$('#f-model').oninput=hint;hint()}
 const tr=$('#f-temp');if(tr)tr.oninput=()=>$('#tv').textContent=tr.value;$('#f-mp').oninput=e=>$('#mpv').textContent=e.target.value;

 api('settings',{method:'PUT',body:b}).then(s=>{S=Object.assign(s,{search:S.search});toast('已保存');return api('overview').then(o=>{OV=o;chrome();if(!test)return drawModel();$('#out').innerHTML='<div class="res">测试中…</div>';return api('test',{method:'POST',body:{}}).then(r=>{drawModel();$('#out').innerHTML=r.ok?`<div class="res ok">连接成功 · ${r.latency_ms} ms</div>`:`<div class="res bad">${esc(ERR[r.code]||r.code)}<br><small>${esc(r.message||'')}</small></div>`})})}).catch(e=>{const o=$('#out');if(o)o.innerHTML=`<div class="res bad">${esc(e.message)}</div>`})}

 const left=`<div class="idl"><div class="portrait-lg">${bust(feminine.test((c.name||'')+(c.identity||'')))}</div><div class="in"><h2>${esc(nm(c.name))}</h2>${(c.alias||[]).length?`<div class="note">又名 ${esc(c.alias.join('、'))}</div>`:''}<p class="prose">${esc(c.identity||'身份还在整理。')}</p><div class="chips">${stag(c.verification_status)}${c.low_data?'<span class="tg w">待补充</span>':''}</div><div class="note">${esc(c.source_novel||'')}</div></div></div>`;
if(V.edit){$('#page').innerHTML=`<div class="wrap">${head}<div class="idd">${left}<div class="card"><label style="margin-top:0">身份</label><input type="text" id="e-identity" value="${esc(c.identity)}"><label>背景</label><textarea id="e-background">${esc(c.background)}</textarea><div class="g2"><div><label>人生愿望（核心动机）</label><input type="text" id="e-core_motivation" value="${esc(c.core_motivation)}"></div><div><label>核心创伤</label><input type="text" id="e-core_trauma" value="${esc(c.core_trauma)}"></div></div>
  <div class="g2"><div><label>核心特质（每行一条）</label><textarea id="e-core_personality">${esc(lines(c.core_personality))}</textarea></div><div><label>可变特质（每行一条）</label><textarea id="e-variable_personality">${esc(lines(c.variable_personality))}</textarea></div></div>
  <div class="g2"><div><label>说话风格</label><textarea id="e-ss">${esc(ss.summary||'')}</textarea></div><div><label>称呼习惯</label><textarea id="e-addr">${esc(ss.address||'')}</textarea></div></div><label>口头禅 / 典型台词（每行一句，最多 5 句）</label><textarea id="e-phr">${esc(lines(ss.sample_phrases))}</textarea>
  <div class="g2"><div><label>行为倾向（每行一条）</label><textarea id="e-behavioral_tendencies">${esc(lines(c.behavioral_tendencies))}</textarea></div><div><label>别名（每行一个）</label><textarea id="e-alias">${esc(lines(c.alias))}</textarea></div></div>
  <div class="g2"><div><label>核心规则（不应违背）</label><textarea id="e-core_rules">${esc(lines(c.core_rules))}</textarea></div><div><label>禁止行为</label><textarea id="e-forbidden_behaviors">${esc(lines(c.forbidden_behaviors))}</textarea></div></div>
  <label>人物关系（每行：名字｜关系｜阶段）</label><textarea id="e-rel">${esc((c.relationships||[]).map(r=>[r.name,r.relation,r.stage].join('｜')).join('\n'))}</textarea>
  <label>固定记忆（每行：重要度1-10｜内容；AI 不能修改它们）</label><textarea id="e-mem" style="min-height:110px">${esc((c.canon_memories||[]).map(m=>m.importance+'｜'+m.content).join('\n'))}</textarea>
  <label>当前时间阶段</label><select id="e-stage" style="padding:8px;border:1px solid var(--line);border-radius:10px"><option value="">（无）</option>${Object.keys(stg).map(k=>`<option value="${k}"${tl.current_stage===k?' selected':''}>${stageName[k]||'经历'}</option>`).join('')}</select></div></div></div>`;
  $('#bk').onclick=()=>{V.cid=null;V.edit=false;load()};$('#ce').onclick=()=>{V.edit=false;load()};
  $('#sv2').onclick=()=>{const g=i=>$('#e-'+i).value,L=i=>unl(g(i));const patch={identity:g('identity'),background:g('background'),core_motivation:g('core_motivation'),core_trauma:g('core_trauma'),core_personality:L('core_personality'),variable_personality:L('variable_personality'),behavioral_tendencies:L('behavioral_tendencies'),alias:L('alias'),core_rules:L('core_rules'),forbidden_behaviors:L('forbidden_behaviors'),speech_style:{summary:g('ss'),address:g('addr'),sample_phrases:L('phr')},
   relationships:L('rel').map(x=>{const p=x.split(/[｜|]/).map(s=>s.trim());return{name:p[0],relation:p[1]||'',stage:p[2]||''}}),canon_memories:L('mem').map(x=>{const p=x.split(/[｜|]/);return p.length>1&&/^\d+$/.test(p[0].trim())?{importance:+p[0],content:p.slice(1).join('｜').trim()}:{importance:5,content:x}}),timeline:{current_stage:g('stage')||null}};
   api('card',{method:'PUT',body:{character_id:c.character_id,patch}}).then(()=>{V.edit=false;toast('已保存');load()}).catch(e=>toast(e.message))};return}
 $('#page').innerHTML=`<div class="wrap dossier">${head}<div class="idd">${left}<div class="secs">
  <div class="card"><h3>性格</h3><div class="prose">${(c.core_personality||[]).join(' · ')||'性格还在从公开资料里整理。'}</div>${(c.variable_personality||[]).length?`<div class="note" style="margin-top:8px">也会表现出 ${esc((c.variable_personality||[]).join('、'))}</div>`:''}</div>
  <div class="card"><h3>说话</h3><div class="prose">${esc(ss.summary||'说话的习惯还没写下来。')}</div>${ss.address?`<div class="note" style="margin-top:6px">怎么称呼人：${esc(ss.address)}</div>`:''}<div style="margin-top:8px">${li(ss.sample_phrases,x=>'“'+esc(x)+'”')}</div></div>
  ${life}
  <div class="card full"><h3>身世</h3><div class="prose">${esc(c.background||'身世还在整理。')}</div></div>
  <div class="card"><h3>人生愿望与创伤</h3><div class="li"><span class="s">愿望</span> ${esc(c.core_motivation||'（空）')}</div><div class="li"><span class="s">创伤</span> ${esc(c.core_trauma||'（空）')}</div><h3 style="margin-top:10px">行为倾向</h3>${li(c.behavioral_tendencies)}</div>
  <div class="card"><h3>核心规则</h3>${li(c.core_rules)}<h3 style="margin-top:10px">禁止行为</h3>${li(c.forbidden_behaviors)}</div>
  <div class="card"><h3>人物关系</h3>${li(c.relationships,r=>`<b>${esc(r.name)}</b> · ${esc(r.relation)}${r.stage?' · '+esc(r.stage):''}${cite(r.sources)}`)}</div>
  <div class="card full"><h3>记得的事</h3>${(c.canon_memories||[]).length? (c.canon_memories||[]).map(m=>`<div class="li">${esc(m.content)}</div>`).join('') : '<div class="note">还没有单独记下的往事。</div>'}</div>
  ${(c.conflicts||[]).length?`<div class="card full"><h3>资料冲突（已并列保留，请你判断）</h3>${c.conflicts.map(x=>`<div class="li"><b>${esc(x.field)}</b>${x.candidates.map(k=>`<div>· ${esc(k.claim)}${cite(k.sources)}</div>`).join('')}</div>`).join('')}</div>`:''}
  <div class="card full"><h3>资料来源</h3>${li(c.info_sources,s=>`<span class="tg in">${esc(s.id)}</span> ${esc(s.name||dom(s.url))} <span class="s">${esc(dom(s.url))}${s.edition==='adaptation'?' · 改编版':''}</span>`)}</div></div></div></div>`;
 $('#bk').onclick=()=>{V.cid=null;load()};$('#ed').onclick=()=>{V.edit=true;clearInterval(timer);load()};
 if($('#cf'))$('#cf').onclick=()=>{if(c.low_data&&!confirm('这张卡标记为“资料不足”，确认后仍会被当作角色设定使用。确定吗？'))return;api('card/confirm',{method:'POST',body:{character_id:c.character_id,confirmed:true}}).then(()=>{toast('已确认');load()})};
 if($('#un'))$('#un').onclick=()=>api('card/confirm',{method:'POST',body:{character_id:c.character_id,confirmed:false}}).then(load);
 $('#bd').onclick=()=>api('pending_bind',{method:'POST',body:{character_id:c.character_id}}).then(r=>{toast('已设为待绑定：'+r.name);V.cid=null;load()}).catch(e=>toast(e.message));
 $('#dl').onclick=()=>{if(confirm('删除这张身份卡及其记忆？此操作不可撤销。'))api('card?id='+c.character_id,{method:'DELETE'}).then(()=>{V.cid=null;load()})}})}
// Ambient particle animation intentionally removed for a calm, stable desktop UI.
try{const h=location.hash.slice(1);if(PAGES[h])V.p=h}catch(e){}go(V.p);
})();
</script>
</body>
</html>
