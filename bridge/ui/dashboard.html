<html lang="zh-CN">

<title>NovelSims 后端</title>
<style>
:root{--esp:#0f172a;--esp2:#1e293b;--cream:#f8fafc;--cream2:#f1f5f9;--paper:#ffffff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--chip:#e2e8f0;--sun:#3b82f6;--gold:#6366f1;--green:#10b981;--ok:#059669;--warn:#d97706;--bad:#dc2626;--r:16px;
--serif:"Inter","SF Pro Display","Segoe UI",system-ui,sans-serif;
--font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft JhengHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);font:13px/1.55 var(--font);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.sheet{margin:12px;height:calc(100vh - 24px);background:var(--cream);border-radius:28px;overflow:auto;scrollbar-width:thin;scrollbar-color:#cdb78f transparent}
.win-controls{display:flex;gap:6px;align-items:center;margin-left:8px}.win-controls button{width:30px;height:30px;border:1px solid rgba(120,150,140,.22);border-radius:50%;background:rgba(255,255,255,.5);color:#315d59;cursor:pointer}.win-controls button:hover{background:#e6f0ea}.nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:22px;padding:14px 40px;background:var(--cream);border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:27px;letter-spacing:.5px;min-width:170px}
.links{display:flex;gap:28px;margin:0 auto}
.links button{padding:6px 0;border-bottom:2px solid transparent;color:var(--ink);opacity:.62;font-size:13px}
.links button:hover{opacity:1}.links button.on{opacity:1;font-weight:600;border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;width:210px;height:38px;border:1px solid var(--line);border-radius:99px;padding:0 14px;color:var(--mut);background:var(--paper)}
.search input[type=text]{border:0;background:none;padding:0;border-radius:0;outline:0;font:inherit;color:var(--ink);width:100%}
.topr{display:flex;align-items:center;gap:10px}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}.ib:hover{background:var(--soft)}
.ib em{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 4px}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;border:1px solid #d9c6a2;border-radius:99px;padding:0 14px 0 7px;font-size:12px;white-space:nowrap;background:transparent}
.pill .av{width:24px;height:24px;font-size:11px}
.main{padding:6px 40px 44px}.wrapx{max-width:1240px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin:10px auto 18px;flex-wrap:wrap;max-width:1240px}
h1{margin:0;font-family:var(--serif);font-size:46px;font-weight:400;letter-spacing:-1px;line-height:1.08}
.sub{color:var(--mut);font-size:13px;padding-bottom:7px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 12px;font-size:12px;color:#6b4f1d}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card>h3,.hd h2{margin:0;font-size:15px;font-weight:600;font-family:var(--serif);letter-spacing:.2px}
/* ---- overview ---- */
.hero2{position:relative;border-radius:28px;overflow:hidden;height:600px;background:var(--esp)}
.hero2>svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero2 .ht{position:absolute;left:0;right:0;top:46px;text-align:center;padding:0 40px}
.hero2 h1{font-size:60px;color:#2a1c12;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.hero2 .hs{max-width:560px;margin:10px auto 18px;color:#4a3626;font-size:13px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--esp2);color:var(--cream);border-radius:99px;padding:10px 22px}
.finder{position:absolute;left:5%;right:5%;bottom:26px;background:rgba(43,33,28,.93);color:#fff3dc;border-radius:22px;padding:20px 26px 22px}
.finder .fh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.finder h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:400}.finder .fs{color:#cdb99a;font-size:12px}
.seg2{display:flex;gap:6px}.seg2 button{border-radius:99px;padding:6px 18px;color:#d9c6a6;background:rgba(255,255,255,.08)}.seg2 .on{background:#fff8ea;color:#2a1c12}
.fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.fields label{margin:0 0 5px;color:#e9d9bb;font-size:11px;letter-spacing:1px}
.fields div.v{border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;color:#fff;min-height:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigbtn{display:block;width:100%;background:#fff8ea;color:#2a1c12;border-radius:99px;padding:12px;text-align:center;font-weight:600}
.statement{text-align:center;padding:64px 0 28px}
.statement h2{margin:0 auto;font-family:var(--serif);font-weight:400;font-size:54px;line-height:1.12;letter-spacing:-1px;max-width:900px}
.statement p{max-width:640px;margin:16px auto 0;color:var(--mut)}
.statband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 40px}
.sb{padding:22px 8px;text-align:center}.sb+.sb{border-left:1px solid var(--line)}
.sb b{display:block;font-family:var(--serif);font-weight:400;font-size:52px;line-height:1}.sb span{color:var(--mut);font-size:12px}
.testi{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.tcard{background:var(--cream2);border-radius:26px;padding:26px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.port{height:190px;border-radius:18px;display:grid;place-items:center;color:#fff8ea;font-family:var(--serif);font-size:84px}
.quote{font-family:var(--serif);font-size:25px;line-height:1.35;margin:0 0 14px}
.who{color:var(--mut);font-size:12px}
.tside{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.tside .row2{display:flex;justify-content:space-between;border-bottom:1px solid var(--soft);padding:7px 0}.tside .row2 span{color:var(--mut)}
.dark2{background:var(--esp);color:#fff3dc;border-radius:28px;padding:54px 40px 40px;margin-top:40px}
.dark2 h2{margin:0;text-align:center;font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:-.5px}
.dark2 .ds{text-align:center;color:#cdb99a;max-width:560px;margin:10px auto 28px}
.plan{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;align-items:stretch}
.plan .pic{border-radius:22px;overflow:hidden;min-height:420px}.plan .pic svg{width:100%;height:100%;display:block}
.planc{margin-left:-90px;margin-top:28px;margin-bottom:28px;background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.28);z-index:2}
.planc h3{margin:0 0 4px;font-family:var(--serif);font-size:26px;font-weight:400}.planc .ps{color:var(--mut);font-size:12px;margin-bottom:6px}
.planc label{margin:10px 0 4px}.planc input,.planc select{border-radius:12px}
/* ---- shared components ---- */
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;height:34px;padding:0 4px;border-bottom:1px solid var(--soft)}.kv:last-child{border:0}.kv span{color:var(--mut)}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff8ea;font-weight:600;font-style:normal;flex:none;font-family:var(--serif)}
.tg{display:inline-block;border-radius:99px;padding:0 10px;font-size:11px;line-height:21px;background:var(--chip);color:#6b4f1d;white-space:nowrap}
.tg.ok{background:#dfeccf;color:var(--ok)}.tg.bad{background:#f6d9d1;color:var(--bad)}.tg.w{background:#fbe3b8;color:var(--warn)}.tg.in{background:#e6dcc8;color:#5b4a34}
.btn{background:var(--paper);border:1px solid #d9c6a2;border-radius:99px;padding:7px 18px;white-space:nowrap}.btn:hover{background:var(--soft)}
.btn.p{background:var(--esp2);border-color:var(--esp2);color:var(--cream)}.btn.p:hover{background:#4a3a31}.btn.s{padding:3px 12px;font-size:12px}.btn.d{color:var(--bad)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:#fffdf7;border-radius:14px;padding:9px 13px;font:inherit;outline:0;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:#b89a63}input[type=range]{width:100%;display:block;margin:6px 0 0;accent-color:#3a2e27}
.note{font-size:12px;color:var(--mut);line-height:1.65;margin-top:6px}
.cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;text-align:left}
.tile.on{background:var(--esp2);color:var(--cream);border-color:var(--esp2)}.tile.on small,.tile.on .t{color:var(--cream)}.tile .av{width:26px;height:26px;font-size:12px}.tile small{color:var(--mut);font-size:11px}
.consent{background:#fbeccb;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:12px;line-height:1.6}
.consent ul{margin:6px 0 8px 16px;padding:0}.consent label{display:flex;gap:8px;align-items:center;color:var(--ink);margin:8px 0 0}
.res{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--soft);font-size:12px}.res.ok{background:#dfeccf;color:var(--ok)}.res.bad{background:#f6d9d1;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}th{color:var(--mut);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.idc>*{min-width:0}.idc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:68px 1fr auto;height:248px;text-align:left;width:100%;padding:0}
.idc:hover{border-color:#bfa575;box-shadow:0 8px 22px rgba(58,46,39,.12)}
.band{position:relative}.band .plb2{position:absolute;right:14px;top:8px;width:28px;opacity:.95}
.idc .av{position:absolute;left:14px;bottom:-22px;width:46px;height:46px;font-size:20px;border:3px solid var(--paper)}
.idc .bd{padding:30px 14px 6px;min-height:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.idc .nm{font-family:var(--serif);font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc .id2{color:var(--mut);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.idc .tags{display:flex;gap:4px;overflow:hidden;margin-top:auto}.idc .ft{display:flex;align-items:center;padding:8px 14px 12px;gap:8px}.idc .ft .s{min-width:0;flex:1;text-align:right}.idc .ft .tg{flex:none}
.trait{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12px;background:var(--chip);color:#6b4f1d}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.idd{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.idl{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}.idl .band{height:100px}
.idl .av{position:absolute;left:18px;bottom:-30px;width:64px;height:64px;font-size:28px;border:4px solid var(--paper)}.idl .band .plb2{width:42px;right:18px;top:14px}
.idl .in{padding:42px 18px 18px;display:flex;flex-direction:column;gap:8px}.idl h2{margin:0;font-family:var(--serif);font-size:28px;font-weight:600}
.mono{font-family:Consolas,"SF Mono",monospace;font-size:11px;color:var(--mut);word-break:break-all}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.secs .card h3{margin-bottom:8px}.secs .full{grid-column:1/-1}
.li{padding:6px 0;border-bottom:1px solid var(--soft);line-height:1.55}.li:last-child{border:0}
.pb{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#43c551,#d9a441);border-radius:99px;transition:width .4s}
.modal{position:fixed;inset:0;background:rgba(43,33,28,.55);display:grid;place-items:center;z-index:9}
.modal>div{background:var(--paper);border-radius:24px;padding:22px 24px;width:min(720px,94vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
pre{margin:0;white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:12px;font-size:12px;line-height:1.55;max-height:50vh;overflow:auto}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--esp2);color:var(--cream);border-radius:99px;padding:9px 20px;z-index:10}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}.tabs button{padding:9px 16px;border-bottom:2px solid transparent;color:var(--mut)}.tabs .on{color:var(--ink);border-color:var(--ink);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{color:var(--mut);padding:16px 8px;line-height:1.7}
@media(max-width:1100px){.cols,.idd,.secs,.testi,.plan,.tcard{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.statband{grid-template-columns:repeat(2,minmax(0,1fr))}.search,.links{display:none}.planc{margin:-30px 16px 0}.hero2 h1{font-size:38px}.nav{padding:12px 18px}.main{padding:6px 18px 30px}}

/* =========================================================

   ========================================================= */
:root{
 --esp:#12383b;--esp2:#0b292d;--cream:#f4f5f0;--cream2:#e8efeb;--paper:#fbfcf8;
 --ink:#172d30;--mut:#718487;--line:#dce6e2;--soft:#eaf0ed;--chip:#dcebe6;
 --sun:#8fb8ad;--gold:#b9cfc5;--green:#4f8f82;--ok:#347e70;--warn:#a97842;--bad:#a75d5d;--r:22px;
 --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Noto Serif CJK SC","Songti SC",serif;
 --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
}
html,body{min-height:100%;background:#102c30;color:var(--ink)}
body{background:radial-gradient(ellipse at 12% 8%,#31585a 0,transparent 38%),linear-gradient(145deg,#0d282c,#193d40 60%,#102c30);font-size:13px;letter-spacing:.01em}
.sheet{margin:12px auto;max-width:1720px;width:calc(100% - 24px);height:calc(100vh - 24px);background:var(--cream);border:1px solid rgba(255,255,255,.35);border-radius:30px;box-shadow:0 28px 90px rgba(0,0,0,.25);scrollbar-color:#a9c1b9 transparent}
.nav{padding:14px clamp(20px,4vw,58px);gap:24px;background:rgba(251,252,248,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,230,226,.75)}
.brand{font-family:var(--serif);font-size:25px;letter-spacing:.3px;color:#183a3c;min-width:190px}
#plb svg path{fill:#2e6661!important}#plb svg path:nth-child(2){fill:#b9d1c8!important}#plb svg path:nth-child(3){fill:#8fb9ad!important}#plb svg path:nth-child(4){fill:#477f76!important}
.links{gap:clamp(12px,2.2vw,30px)}.links button{font-size:12px;color:#557073;border-bottom-width:2px;padding:9px 0;transition:.2s}
.links button:hover,.links button.on{color:#173e40}.links button.on{border-color:#548c82}
.search{background:#f5f8f5;border-color:#dce7e2;height:40px}.search:focus-within{border-color:#8fb8ad;box-shadow:0 0 0 3px rgba(143,184,173,.15)}
.ib{background:#fbfcf8;border-color:#dce6e2;color:#31595a;width:40px;height:40px}.ib:hover{background:#eaf2ee}
.pill{border-color:#dce6e2;background:#f7faf7;color:#34585a}.pill .av{background:#497e76!important}
.main{padding:14px clamp(20px,4vw,58px) 54px}.wrapx,.wrap{max-width:1320px}
.ph{margin:16px auto 22px;max-width:1320px;align-items:center;gap:12px}h1{font-size:42px;color:#173c3e;letter-spacing:-.8px}
.sub{color:#7b8e8d}.chip{background:#e2eee9;color:#47766e;border:1px solid #d4e5de;padding:4px 13px}

.card>h3,.hd h2{font-family:var(--font);font-weight:650;color:#25494a;font-size:14px;letter-spacing:.01em}
/* cinematic teal welcome panel */
.hero2{height:510px;border-radius:30px;background:radial-gradient(ellipse at 72% 25%,rgba(115,163,153,.45),transparent 30%),radial-gradient(ellipse at 18% 75%,rgba(57,112,107,.55),transparent 35%),linear-gradient(125deg,#173d40 0%,#244e50 48%,#102d32 100%);box-shadow:0 20px 48px rgba(13,46,48,.18)}
.hero2>svg.art{display:none}
.hero2:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 5%,rgba(239,247,239,.15),transparent 50%),linear-gradient(115deg,transparent 20%,rgba(255,255,255,.055) 48%,transparent 72%);pointer-events:none}
.hero2:after{content:"✧";position:absolute;right:9%;top:13%;font-family:var(--serif);font-size:180px;line-height:1;color:rgba(216,237,226,.10);transform:rotate(-12deg);pointer-events:none}
.hero2 .ht{top:60px;z-index:1}.hero2 h1{font-size:clamp(42px,5vw,62px);color:#f4f7f1;text-shadow:0 3px 24px rgba(0,0,0,.22);letter-spacing:-1.2px}
.hero2 .hs{color:rgba(236,246,239,.78);font-size:14px;max-width:590px;line-height:1.9;margin:15px auto 20px}
.cta{background:#f3f7f1;color:#173e40;padding:11px 24px;font-weight:650;box-shadow:0 7px 22px rgba(0,0,0,.12);transition:transform .2s,box-shadow .2s}.cta:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.finder{left:4%;right:4%;bottom:24px;background:rgba(244,248,243,.94);color:#1b3c3e;border:1px solid rgba(255,255,255,.65);border-radius:24px;padding:18px 22px 20px;box-shadow:0 12px 36px rgba(0,0,0,.16);backdrop-filter:blur(18px)}
.finder h2{color:#23494a;font-family:var(--serif);font-size:25px}.finder .fs{color:#7b9290}.finder .fh{margin-bottom:10px}
.seg2 button{color:#5f7978;background:#e8efeb}.seg2 .on{background:#214d4d;color:#f5f8f2}
.fields{gap:10px;margin-bottom:12px}.fields label{color:#7d9290;letter-spacing:.04em}.fields div.v{background:#fff;border:1px solid #e2ebe6;color:#29494a;border-radius:13px;min-height:40px;padding:8px 11px}
.bigbtn{background:#194447;color:#f4f8f2;border-radius:14px;padding:11px 16px;transition:.2s}.bigbtn:hover{background:#28615d}
.statement{padding:60px 0 24px}.statement h2{color:#23484a;font-size:clamp(38px,4.5vw,54px)}.statement p{color:#7c8f8d;line-height:1.9}
.statband{border-color:#dce7e2;margin:14px 0 34px}.sb{padding:22px 8px}.sb+.sb{border-color:#dce7e2}.sb b{font-size:48px;color:#315f5b}.sb span{color:#829492}
.tcard{background:linear-gradient(135deg,#dceae4,#edf3ed);border:1px solid #dce8e1;border-radius:25px;padding:24px}.port{border-radius:22px;background:linear-gradient(145deg,#285b5b,#91b7a9)!important;color:#f5f8f2}.quote{font-family:var(--serif);color:#28494a;font-size:24px}.who{color:#78908b}
.tside{background:#fbfcf8;border:1px solid #e0e9e4;border-radius:25px;padding:24px}.tside .row2{border-color:#e8efeb}.tside .row2 span{color:#829391}
.dark2{background:linear-gradient(135deg,#173e41,#0e3034);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:48px 36px 36px;box-shadow:0 18px 44px rgba(15,48,49,.13)}.dark2 h2{color:#f0f5ef}.dark2 .ds{color:#b8ceca}
.plan .pic{border-radius:24px;overflow:hidden}.planc{border:1px solid #e2ebe6;box-shadow:0 18px 45px rgba(0,0,0,.2);border-radius:24px}.planc h3{font-family:var(--serif);color:#23494a;font-size:28px}
/* controls */
.btn{background:#fbfcf8;border:1px solid #d8e4de;color:#365c5a;border-radius:99px;padding:8px 18px;transition:.18s}.btn:hover{background:#eaf2ed;border-color:#bdd3ca}.btn.p{background:#194447;border-color:#194447;color:#f5f8f2}.btn.p:hover{background:#28615d}.btn.d{color:#a65d5d}
label{color:#718785}input[type=text],input[type=password],textarea,select{background:#fff;border:1px solid #dce7e2;border-radius:13px;color:#1d3c3e;padding:10px 13px}input:focus,textarea:focus,select:focus{border-color:#83aaa0;box-shadow:0 0 0 3px rgba(131,170,160,.14)}input[type=range]{accent-color:#477f76}
.note,.s{color:#829391}.kv{border-color:#e7efeb}.kv span{color:#829391}.av{background:#477f76;color:#f4f8f2}.tg{background:#e3eee8;color:#47776d}.tg.ok{background:#dceee6;color:#347e70}.tg.bad{background:#f3e2df;color:#a75d5d}.tg.w{background:#f4eadb;color:#9a7546}.tg.in{background:#e7ece8;color:#627c77}
.tile{background:#fbfcf8;border-color:#e0e9e4;border-radius:16px;height:54px;transition:.18s}.tile:hover{border-color:#afc9be;transform:translateY(-1px)}.tile.on{background:#194447;border-color:#194447;color:#f4f8f2}.tile.on small,.tile.on .t{color:#f4f8f2}
.consent{background:#f3eee2;border-radius:16px;padding:12px 14px}.modal{background:rgba(8,34,36,.58);backdrop-filter:blur(5px)}.modal>div{background:#fbfcf8;border:1px solid #e0e9e4;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.2)}pre{background:#edf3ef;color:#284748;border-radius:14px}.toast{background:#194447;color:#f4f8f2;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tabs{border-color:#dce7e2}.tabs button{color:#829391}.tabs .on{color:#285654;border-color:#548c82}
table{border-collapse:collapse;width:100%}th{color:#728985;font-weight:600;background:#f1f6f2}td,th{border-bottom:1px solid #e6eeea;padding:10px 9px;text-align:left}tr:hover td{background:#f7faf7}
@media(max-width:1100px){.sheet{margin:0;width:100%;height:100vh;border-radius:0}.nav{padding:12px 18px}.main{padding:10px 18px 32px}.hero2{height:570px}.hero2 .ht{top:42px}.finder{left:3%;right:3%;bottom:16px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.brand{min-width:0;font-size:22px}.topr{gap:6px}.topr .pill,.topr #newn{display:none}.hero2{height:620px}.hero2 h1{font-size:38px}.finder{padding:15px}.fields{grid-template-columns:1fr 1fr}.statement h2{font-size:36px}.main{padding-left:14px;padding-right:14px}.dark2{padding:34px 18px 22px}}


/* ELIXARA GLASS / RESPONSIVE PASS */
:root{--glass:rgba(247,251,248,.58);--glass-strong:rgba(249,252,249,.78);--glass-line:rgba(255,255,255,.62);--glass-shadow:0 18px 48px rgba(13,48,50,.10)}
html,body{width:100%;overflow:hidden}
body{position:relative}
.sheet{width:min(1680px,calc(100vw - 36px));height:calc(100dvh - 36px);margin:18px auto;border-radius:30px;background:rgba(241,247,243,.80);backdrop-filter:blur(26px) saturate(135%);-webkit-backdrop-filter:blur(26px) saturate(135%);border:1px solid rgba(255,255,255,.68);box-shadow:0 30px 100px rgba(0,0,0,.28)}
.nav{background:rgba(247,251,248,.72);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid rgba(255,255,255,.52);padding:14px clamp(22px,3vw,52px)}
.main{padding:16px clamp(22px,3.4vw,58px) 56px}
.wrapx,.wrap,.ph{max-width:1480px}
.card,.idl,.idc,.tside,.planc,.finder,.tcard,.dark2,.modal>div{backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
.card{background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(239,247,243,.60));border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.card:hover{border-color:rgba(255,255,255,.92);box-shadow:0 22px 54px rgba(13,48,50,.13)}

.idc .band:after,.idl .band:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(12,49,52,.18),transparent 55%),radial-gradient(circle at 78% 20%,rgba(255,255,255,.4),transparent 20%);pointer-events:none}
.idc .av{z-index:1;bottom:-24px;width:52px;height:52px;border:3px solid rgba(255,255,255,.88);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.idc .bd{padding:32px 16px 8px;gap:7px}
.idc .nm{font-family:var(--serif);font-size:24px;letter-spacing:.02em;color:#193d3e}
.idc .id2{font-size:12px;line-height:1.65;color:#617b7a;min-height:40px}
.idc .tags{flex-wrap:wrap;max-height:42px;overflow:hidden}
.idc .trait{background:rgba(213,233,224,.8);border:1px solid rgba(255,255,255,.75);border-radius:99px;color:#3c7168;padding:3px 9px}
.idc .ft{border-top:1px solid rgba(208,225,216,.72);padding:10px 15px 12px}
.idl{background:linear-gradient(155deg,rgba(255,255,255,.84),rgba(229,242,235,.76));border:1px solid rgba(255,255,255,.82);box-shadow:var(--glass-shadow)}
.idl .band{height:150px}
.idl .in{padding:48px 22px 22px}
.idl h2{font-size:32px;letter-spacing:.02em}
.secs .card{min-height:150px}
.secs .card h3{font-size:15px;letter-spacing:.02em}
.ph{margin-top:20px;margin-bottom:24px}
#ttl{font-size:clamp(34px,3vw,48px)}
.tile{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(14px);transition:all .25s}
.tile:hover{transform:translateX(3px);box-shadow:0 8px 24px rgba(16,57,56,.08)}
.btn,.ib,.search{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(13,48,50,.10)}
.modal{backdrop-filter:blur(14px)}
#ns-particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.62}
.sheet{position:relative;z-index:1}
@keyframes floatGlow{0%,100%{transform:translateY(0) rotate(-8deg);opacity:.65}50%{transform:translateY(-12px) rotate(-4deg);opacity:1}}
@keyframes cardEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#page>.wrap,#page>.wrapx{animation:cardEnter .48s ease both}
@media(min-width:1500px){.cols{grid-template-columns:290px minmax(0,1fr);gap:22px}.secs{gap:18px}}
@media(max-width:1250px){.sheet{width:calc(100vw - 20px);height:calc(100dvh - 20px);margin:10px}.main{padding:12px 22px 36px}.nav{gap:14px}.brand{min-width:150px}.links{gap:16px}.search{width:180px}.cols{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:900px){.sheet{width:100%;height:100dvh;margin:0;border-radius:0}.cols,.idd,.secs,.testi,.plan,.tcard{grid-template-columns:1fr}.nav{padding:12px 16px}.links{display:none}.main{padding:12px 16px 30px}.hero2{height:560px}.hero2 .ht{left:5%;right:5%;top:38px}.finder{left:3%;right:3%;bottom:14px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.hero2{height:620px}.hero2 .ht h1{font-size:36px}.hero2 .hs{font-size:12px}.fields{grid-template-columns:1fr 1fr}.idc{height:270px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* ---- curated global book library ---- */
.library-shell{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.library-hero{position:relative;overflow:hidden;border-radius:30px;padding:34px 38px;min-height:220px;color:#f4fbf8;background:linear-gradient(115deg,rgba(8,42,48,.96),rgba(20,78,78,.84)),radial-gradient(circle at 80% 20%,#a6d9c9,transparent 35%);box-shadow:0 22px 55px rgba(9,47,51,.18)}
.library-hero:after{content:"";position:absolute;width:360px;height:360px;right:-40px;top:-190px;border:1px solid rgba(255,255,255,.24);border-radius:50%;box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 72px rgba(255,255,255,.025)}
.library-hero h2{font:400 clamp(30px,4vw,48px)/1.1 var(--serif);margin:0 0 10px;letter-spacing:.02em}.library-hero p{max-width:590px;color:rgba(239,250,246,.76);margin:0 0 18px}
.library-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c7e4d9}
.library-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.library-tabs,.rank-tabs{display:flex;gap:7px;flex-wrap:wrap}.library-tabs button,.rank-tabs button{padding:8px 15px;border-radius:99px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.55);color:#426765;backdrop-filter:blur(14px)}.library-tabs button.on,.rank-tabs button.on{background:#174b4d;color:#f4fbf8;border-color:#174b4d}
.bookshelf{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 380px);padding:20px 10px;background:linear-gradient(to bottom,#1e293b 0%,#0f172a 100%);border-radius:16px;box-shadow:inset 0 0 20px rgba(0,0,0,.3)}
.shelf{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;min-height:180px;margin-bottom:24px;padding:0 12px 12px;border-bottom:8px solid #334155;position:relative;perspective:800px}
.shelf:last-child{border-bottom:none}
.book-spine{position:relative;width:42px;height:160px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);border-radius:4px 4px 2px 2px;box-shadow:2px 4px 8px rgba(0,0,0,.4);cursor:pointer;transition:transform .25s ease,box-shadow .25s;transform-origin:bottom center;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;color:#fff;font-size:13px;font-weight:600;letter-spacing:1px;padding:8px 4px;overflow:hidden}
.book-spine:hover{transform:rotateY(-18deg) translateZ(12px) translateX(-6px);box-shadow:8px 8px 16px rgba(0,0,0,.5);z-index:5}
.book-spine .spine-title{max-height:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-grid{display:contents} /* fallback */
.book-cover{height:190px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#fff;text-align:center;padding:18px;background:linear-gradient(145deg,#204f52,#a2c5b7)}.book-cover:before,.book-cover:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.32);border-radius:50%;width:180px;height:180px;transform:rotate(-22deg)}.book-cover:after{width:125px;height:125px;transform:rotate(28deg)}.book-cover .book-glyph{font:400 64px/1 var(--serif);opacity:.88;text-shadow:0 8px 20px rgba(0,0,0,.18);z-index:1}.book-cover .cover-title{position:absolute;bottom:15px;left:12px;right:12px;font:400 17px var(--serif);text-shadow:0 2px 8px rgba(0,0,0,.35);z-index:1}.book-cover.classic{background:linear-gradient(145deg,#744d40,#c49a72)}.book-cover.fantasy{background:linear-gradient(145deg,#193d4c,#6d9b9a)}.book-cover.hero{background:linear-gradient(145deg,#533b32,#bd8052)}.book-cover.history{background:linear-gradient(145deg,#5a4537,#b99a69)}.book-cover.mystery{background:linear-gradient(145deg,#202e39,#607d80)}.book-cover.romance{background:linear-gradient(145deg,#875d69,#d2a5a0)}.book-cover.scifi{background:linear-gradient(145deg,#1d3f57,#4e8a9a)}.book-cover.literary{background:linear-gradient(145deg,#47665b,#a5b7a0)}
.book-cover.jj-cover{padding:0;background:#e9eee9}.book-cover.jj-cover img{width:100%;height:100%;object-fit:cover;display:block}.book-info{padding:13px 14px 15px}.book-title{font:500 18px/1.25 var(--serif);color:#1c4141;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-author{font-size:11px;color:#718783;margin-bottom:9px}.book-tags{display:flex;gap:5px;flex-wrap:wrap}.book-tags span{font-size:10px;color:#47716b;background:rgba(211,233,224,.72);border:1px solid rgba(255,255,255,.8);border-radius:99px;padding:3px 7px}.book-rank{position:absolute;top:10px;left:10px;background:rgba(245,250,246,.84);backdrop-filter:blur(12px);color:#315d59;border-radius:99px;padding:4px 9px;font-size:10px;z-index:2}
.library-section-title{display:flex;align-items:end;justify-content:space-between;gap:10px}.library-section-title h3{margin:0;font:400 27px var(--serif);color:#234b49}.library-section-title span{color:var(--mut);font-size:11px}.book-detail{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;margin-top:16px}.book-detail .book-cover{height:280px;border-radius:18px}.book-detail h2{font:400 32px var(--serif);margin:0 0 5px;color:#214847}.book-detail p{color:#637d78;line-height:1.8}.character-pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.character-pills span{background:#e4f0e9;border:1px solid #fff;border-radius:99px;padding:7px 12px;color:#315f58;font-size:12px}
@media(max-width:1100px){.shelf{min-height:150px}.book-spine{height:140px;width:36px}}@media(max-width:560px){.book-spine{width:32px;height:120px;font-size:11px}}

/* NovelSims 0.3.2 — full desktop composition: no oval clipping */
:root{--ink:#18263b;--mut:#748198;--line:rgba(255,255,255,.62);--paper:rgba(255,255,255,.78);--cream:#f4f5fa;--cream2:#e9ecf7;--esp:#182c4b;--esp2:#243d67;--chip:#e5e9f6;--sun:#a9b9ed;--gold:#d8b77b;--r:20px}
html,body{width:100%;height:100%;min-height:100%;overflow:hidden;background:#101b2d}
body{font-size:14px;line-height:1.6;color:var(--ink);background:radial-gradient(ellipse at 12% 0%,rgba(106,133,206,.38),transparent 34%),radial-gradient(ellipse at 94% 18%,rgba(164,125,191,.27),transparent 30%),linear-gradient(135deg,#111d32 0%,#1d3150 48%,#293b5a 100%)}
#ns-particles{display:none!important}
.sheet{width:100%;height:100%;max-width:none;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(210,220,245,.45) transparent}
.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:28px;width:100%;min-height:78px;padding:12px clamp(22px,4vw,58px);background:rgba(17,29,49,.66);border:0;border-bottom:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}

function showJjwxcBook(b){
 const cover=b.cover_url?`<div class="book-cover jj-cover"><img src="${esc(b.cover_url)}" alt="${esc(b.title)}封面" referrerpolicy="strict-origin-when-cross-origin" onerror="this.remove();this.parentNode.classList.add('cover-missing')"></div>`:bookCover({title:b.title,cover:'literary'});

 m.querySelector('#jj-cover-search').onclick=()=>{const box=m.querySelector('#jj-cover-results');box.innerHTML='<span class=note>正在检索公开图片…</span>';api('jjwxc/covers?q='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author||'' )).then(r=>{const rows=r.covers||[];box.innerHTML=rows.map((x,i)=>`<button class=btn data-cover-index="${i}" title="${esc(x.source)}"><img src="${esc(x.url)}" style="width:54px;height:76px;object-fit:cover;border-radius:7px" loading="lazy"></button>`).join('')||'<span class=note>没有检索到可用封面候选。</span>';box.querySelectorAll('[data-cover-index]').forEach((el,i)=>el.onclick=()=>api('jjwxc/cover',{method:'POST',body:{id:b.id,cover_url:rows[i].url}}).then(()=>{b.cover_url=rows[i].url;const old=m.querySelector('.book-cover');if(old){old.classList.add('jj-cover');old.innerHTML=`<img src="${esc(b.cover_url)}" alt="${esc(b.title)}封面" referrerpolicy="strict-origin-when-cross-origin" onerror="this.remove();this.parentNode.classList.add('cover-missing')">`;}toast('封面已保存到本机')} ).catch(e=>toast(e.message))) }).catch(e=>{box.innerHTML=`<span class=note>${esc(e.message)}</span>`})};

 <div class="bar" style="margin-top:10px"><button class="btn p" id="n-go">创建并开始</button><button class="btn" id="n-x">取消</button></div>`);

function pNovels(){return api('novels').then(r=>{const L=r.novels.filter(n=>match(n.title,n.author,(n.characters||[]).join(' ')));if(!V.nid||!L.find(n=>n.novel_id===V.nid))V.nid=L.length?L[0].novel_id:null;

 return api('novel?id='+V.nid).then(n=>{const t=n.task,run=t&&t.state==='running';
 const modeTxt={web:'全网检索',manual:'自设剧情',both:'检索+自设'}[n.mode];

  msg=`<div class="card"><div class="hd"><b>${run?'检索进行中':{done:'已完成',needs_manual:'没有找到可用资料',error:'出错了',cancelled:'已取消'}[t.state]||t.state}</b>${run?'<button class="btn s" id="tc">取消</button>':''}</div>${run?`<div class="pb"><i style="width:${t.progress}%"></i></div>`:''}<div class="note ${cls}" style="color:${cls==='bad'?'var(--bad)':'var(--mut)'}">${esc(t.message)}${t.state!=='needs_manual'&&t.result&&t.result.summary?'<br>'+esc(t.result.summary):''}${t.result&&t.result.error_code?'（'+esc(ERR[t.result.error_code]||t.result.error_code)+'）':''}</div>
  ${t.state==='needs_manual'?'<div class="bar" style="margin-top:8px"><button class="btn p" id="tm">改为自己写剧情</button></div>':''}
